name: Deploy demo to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'data/**'
      - 'docs/pack/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Until the FLY_API_TOKEN repo secret exists (one-time setup in the
      # README), skip cleanly instead of failing every push to main.
      - name: Check for deploy token
        id: token
        run: echo "present=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Skip notice
        if: steps.token.outputs.present != 'true'
        run: echo "::notice::FLY_API_TOKEN not configured — skipping deploy (see README, Hosting)."
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - run: flyctl deploy --config deploy/fly.toml --dockerfile deploy/Dockerfile --remote-only
        if: steps.token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
